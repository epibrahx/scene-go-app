# 项目级 mise 配置（SceneGo）
# 对齐 Expo SDK 57 官方 EAS iOS 镜像工具链：Node 22 / Ruby 3.2 / CocoaPods 1.16.2

[tools]
node = "22"        # Expo SDK 57 最低 Node 22.13.x，取 LTS 22
bun = "1.3.14"     # 与 lockfile / 脚本 bun 保持一致
ruby = "3.2.11"    # 对齐 EAS macOS 镜像的 Ruby 3.2

[env]
# CocoaPods 装入 mise 管理的 Ruby gems，使 pod 指向项目工具链
_.path = "~/.local/share/mise/installs/ruby/3.2.11/bin"
